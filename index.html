<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Forward | Rate games. Find your people.</title>
  <meta name="description" content="Game Forward is an interactive platform where you can rate your favorite video games and connect with others who share your taste.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Life+Savers:wght@400;700;800&family=LXGW+WenKai+Mono+TC:wght@700&family=Love+Ya+Like+A+Sister&family=Madimi+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Reusable PlayStation-style symbol cluster (triangle, square, circle, X) used as background decoration -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="symbol-cluster" viewBox="0 0 755 640">
        <g fill="none" stroke="#cdc9fd" stroke-width="30" stroke-linejoin="round" stroke-linecap="round">
          <path d="M375 22 L470 190 H280 Z"/>
          <rect x="58.5" y="215.5" width="165" height="165" rx="12"/>
          <circle cx="599" cy="298" r="95"/>
        </g>
        <text x="366.5" y="560" text-anchor="middle" font-family="'Madimi One', sans-serif" font-size="250" fill="#cdc9fd">X</text>
      </symbol>
    </defs>
  </svg>

  <div class="phone">
    <div class="screen">

      <!-- Decorative background symbols (one cluster behind each section) -->
      <svg class="cluster cluster--hero" aria-hidden="true" focusable="false"><use href="#symbol-cluster"/></svg>
      <svg class="cluster cluster--signup" aria-hidden="true" focusable="false"><use href="#symbol-cluster"/></svg>
      <svg class="cluster cluster--trending" aria-hidden="true" focusable="false"><use href="#symbol-cluster"/></svg>

      <header class="site-header">
        <a class="logo" href="index.html" aria-label="Game Forward home">
          <img src="assets/swords.png" alt="Game Forward logo: two crossed swords">
        </a>

        <a class="profile-link" href="profile.html" aria-label="Your profile">
          <svg viewBox="0 0 142 140" aria-hidden="true" focusable="false">
            <defs>
              <clipPath id="avatar-clip"><circle cx="71" cy="70" r="68"/></clipPath>
            </defs>
            <circle cx="71" cy="70" r="68" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
            <g clip-path="url(#avatar-clip)" fill="#cdc9fd" stroke="#000" stroke-width="2">
              <ellipse cx="71.5" cy="45" rx="20.5" ry="25"/>
              <rect x="40" y="88" width="63" height="60" rx="25"/>
            </g>
          </svg>
        </a>

        <h1>Game Forward</h1>
      </header>

      <main>
        <p class="intro">
          Welcome to Game Forward, an interactive platform where users can rate their favorite video games and connect with others who may have similar video game interests.
        </p>

        <section class="signup" aria-labelledby="signup-title">
          <h2 id="signup-title">Sign-Up</h2>
          <form class="signup-form" action="#" method="post">
            <div class="field">
              <label class="visually-hidden" for="username">Username</label>
              <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>
            </div>
            <div class="field">
              <label class="visually-hidden" for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password" required>
            </div>
            <button class="create-button" type="submit">Create</button>
          </form>
        </section>

        <section class="trending" aria-labelledby="trending-title">
          <h2 id="trending-title">Trending Games</h2>
          <ul class="covers">
            <li class="cover cover--rdr2">
              <a href="feed.html" aria-label="Red Dead Redemption 2">
                <img src="assets/red-dead-redemption-2.png" alt="Red Dead Redemption 2 cover art">
                <span class="cover-hover">Add Rating</span>
              </a>
            </li>
            <li class="cover cover--acod">
              <a href="feed.html" aria-label="Assassin's Creed Odyssey">
                <img src="assets/assassins-creed-odyssey.png" alt="Assassin's Creed Odyssey cover art">
                <span class="cover-hover">Add Rating</span>
              </a>
            </li>
          </ul>
        </section>
      </main>

      <nav class="nav" aria-label="Main">
        <ul>
          <li><a href="about.html">About</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="feed.html">Feed</a></li>
          <li><a href="rating.html">Ratings</a></li>
          <li><a href="social.html">Social</a></li>
        </ul>
      </nav>

    </div>
  </div>

</body>
</html>
